name: CI

# Repo-root CI for the standalone shaowen-ye/foodweb-3d repository.
# The software lives in prototype/; docs live at the repo root.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dev dependencies (ajv)
        run: npm install
      - name: Test suite (engine stability, schema, adapter round-trips, theory, closed-form)
        run: npm test
      - name: Regenerate adapter native files + phase diagram
        run: npm run adapters && npm run phase-diagram
